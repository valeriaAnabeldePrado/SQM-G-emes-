<!doctype html>
<html lang="es">
  <meta charset="utf-8" />
  <title>Prueba del cerámico interior</title>
  <body style="font:16px system-ui;padding:24px">
    <h1>Cerámico blanco al abrir un departamento</h1>
    <pre id="results">Verificando el material real…</pre>
    <script type="module">
      import * as THREE from 'three'
      import { createBuildWave } from '/src/components/web-sections/edificio-3d/interiors/buildWave.js'
      import { createInteriorMaterials } from '/src/components/web-sections/edificio-3d/interiors/interiorMaterials.js'

      const output = document.querySelector('#results')
      try {
        const renderer = new THREE.WebGLRenderer({ antialias: false })
        renderer.toneMapping = THREE.ACESFilmicToneMapping
        const target = new THREE.WebGLRenderTarget(32, 32)
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 20)
        camera.position.set(0, 5, 0)
        camera.lookAt(0, 0, 0)
        const geometry = new THREE.PlaneGeometry(2, 2).rotateX(-Math.PI / 2)
        geometry.setAttribute('uv1', geometry.attributes.uv.clone())
        const results = []
        const colors = []
        for (const hatch of ['#000000', '#ffffff']) {
          const canvas = document.createElement('canvas')
          canvas.width = canvas.height = 8
          const ctx = canvas.getContext('2d')
          ctx.fillStyle = hatch
          ctx.fillRect(0, 0, 8, 8)
          const mask = new THREE.CanvasTexture(canvas)
          const wave = createBuildWave()
          wave.uBuild.value = 1
          // Simula ambas interpretaciones del rayado del plano: el acabado
          // especificado debe ser cerámico blanco en los dos casos.
          const materials = createInteriorMaterials(wave, mask)
          const scene = new THREE.Scene()
          scene.add(new THREE.AmbientLight('#ffffff', 2))
          for (const [i, key] of ['tile', 'wood'].entries()) {
            if (!materials[key]) continue
            const mesh = new THREE.Mesh(geometry, materials[key])
            mesh.position.y = i * 0.005
            scene.add(mesh)
          }
          renderer.setRenderTarget(target)
          renderer.render(scene, camera)
          const pixels = new Uint8Array(32 * 32 * 4)
          renderer.readRenderTargetPixels(target, 0, 0, 32, 32, pixels)
          const mean = [0, 1, 2].map((c) => {
            let total = 0
            for (let i = c; i < pixels.length; i += 4) total += pixels[i]
            return total / (32 * 32)
          })
          colors.push(mean)
          const white = Math.min(...mean) > 120 && Math.max(...mean) - Math.min(...mean) < 12
          results.push(`${white ? 'PASS' : 'FAIL'} Cerámico blanco con máscara ${hatch}: RGB ${mean.map(Math.round).join(', ')}`)
          Object.values(materials).forEach((m) => m.dispose())
          mask.dispose()
        }
        const unchanged = colors[0].every((c, i) => Math.abs(c - colors[1][i]) < 1)
        results.push(`${unchanged ? 'PASS' : 'FAIL'} El rayado del plano no cambia el material del piso`)
        output.textContent = results.join('\n')
        document.title = results.every((r) => r.startsWith('PASS')) ? 'PASS — cerámico interior' : 'FAIL — cerámico interior'
        renderer.setRenderTarget(null)
        geometry.dispose()
        target.dispose()
        renderer.dispose()
      } catch (error) {
        output.textContent = `ERROR: ${error.message}`
      }
    </script>
  </body>
</html>
